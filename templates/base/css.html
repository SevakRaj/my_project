<style>
  /* Fullscreen loader style */
  #loader-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.7); /* Optional overlay */
      z-index: 100000;
  }
  #loader-container.hidden {
      display: none;
  }
  @media (max-width: 767px) { /* Target small devices */
    #loading-text {
      margin-top: -20px !important;
    }
  }
  .hide-scrollbar::-webkit-scrollbar {
    display: none; /* Hides scrollbar in WebKit browsers (Chrome, Safari, Edge) */
}

.hide-scrollbar {
    scrollbar-width: none; /* Hides scrollbar in Firefox */
    -ms-overflow-style: none; /* Hides scrollbar in IE and Edge (legacy) */
}

/* Custom class for a thin scrollbar */
.thin-scrollbar {
  scrollbar-width: thin; /* Firefox: thin scrollbar */
  scrollbar-color: #888 #f1f1f1; /* Firefox: thumb and track colors */
}

.thin-scrollbar::-webkit-scrollbar {
  width: 5px; /* Width of vertical scrollbar */
  height: 5px; /* Height of horizontal scrollbar */
}

.thin-scrollbar::-webkit-scrollbar-thumb {
  background: #888; /* Color of the scrollbar thumb */
  border-radius: 50%; /* Rounded corners */
}

.thin-scrollbar::-webkit-scrollbar-thumb:hover {
  background: #555; /* Darker color on hover */
}

.thin-scrollbar::-webkit-scrollbar-track {
  background: #f1f1f1; /* Track color */
  border-radius: 50%; /* Rounded corners */
}

</style>
