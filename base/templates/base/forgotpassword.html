{% load static %}
<!DOCTYPE html>
<html
  lang="en"
  class="light-style customizer-hide"
  dir="ltr"
  data-theme="theme-default"
  data-assets-path="{% static 'assets/' %}/"
  data-template="vertical-menu-template-free"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mighty hands | Forgot Password</title>
    <meta name="description" content="Reset your password for BasuriAutomotive" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'assets/img/logoB.ico' %}" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link rel="stylesheet" href="{% static 'assets/vendor/fonts/boxicons.css' %}" />

    <!-- Core CSS -->
    <link rel="stylesheet" href="{% static 'assets/vendor/css/rtl/core.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/vendor/css/rtl/theme-default.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/demo.css' %}" />

    <!-- Vendor CSS -->
    <link rel="stylesheet" href="{% static 'assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css' %}" />

    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="{% static 'assets/vendor/css/pages/page-auth.css' %}" />

    <!-- Helpers -->
    <script src="{% static 'assets/vendor/js/helpers.js' %}"></script>
    <script src="{% static 'assets/js/config.js' %}"></script>

    <style>
      body {
        background-color: #fffaf5;
      }
      .card {
        border: 1px solid #ff9900;
        box-shadow: 0 0 15px rgba(255, 153, 0, 0.2);
      }
      .btn-primary {
        background-color: #ff9900;
        border-color: #ff9900;
      }
      .btn-primary:hover {
        background-color: #e68a00;
        border-color: #e68a00;
      }
      .app-brand img {
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <!-- Content -->
    <div class="container-xxl">
      <div class="authentication-wrapper authentication-basic container-p-y">
        <div class="authentication-inner">
          <!-- Card -->
          <div class="card">
            <div class="card-body">
              {% include 'components/messages.html' %}

              <!-- Logo -->
              <div class="app-brand justify-content-center mb-3">
                <img src="{% static 'assets/img/mighty.png' %}" width="250" height="70" alt="BasuriAutomotive Logo" />
              </div>

              <!-- Welcome Message -->
              <h4 class="mb-2 text-center">Welcome to <strong>Mighty hands</strong>! 👋<br />Forgot Password</h4>
              <p class="mb-4 text-center text-muted">Enter your email and we’ll send you instructions to reset your password.</p>

              <!-- Form -->
              <form id="formAuthentication" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                  <label for="email" class="form-label">Email or Username</label>
                  <input
                    type="text"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autofocus
                  />
                </div>

                <div class="mb-3">
                  <button class="btn btn-primary d-grid w-100" type="submit">Reset Password</button>
                </div>
              </form>

              <!-- Footer Link -->
              <p class="text-center">
                <span>New to our platform?</span>
                <a href="{% url 'user:create' %}">
                  <span>Create an account</span>
                </a>
              </p>
            </div>
          </div>
          <!-- /Card -->
        </div>
      </div>
    </div>

    {% include 'base/js.html' %}
    <script>
      $(".preloader").fadeOut();
    </script>
  </body>
</html>
